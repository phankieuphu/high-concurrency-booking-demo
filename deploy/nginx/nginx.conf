# Stand-in for the cloud L7 load balancer in front of the gateway replicas.
worker_processes auto;
events { worker_connections 16384; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;   # docker DNS: picks up scaled replicas
  upstream gateway {
    zone gateway 64k;
    server gateway:8080 resolve;
    keepalive 256;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      # Retry idempotent requests on another replica if one dies mid-deploy.
      proxy_next_upstream error timeout http_502;
      proxy_next_upstream_tries 2;
    }
  }
}
