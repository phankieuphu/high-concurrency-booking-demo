# Full local stack: 2x gateway (Node.js) behind nginx, 2x booking-api (Go),
# 2x booking-worker (Go, leader election), notification-worker (Node.js),
# Postgres + PgBouncer, Redis, Kafka (KRaft).
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml run --rm seed
#   docker compose -f deploy/docker-compose.yml run --rm stampede -users 3000 -event 1 -tier 1
#
# Chaos drills (see docs/05-resilience-and-failover.md):
#   docker compose -f deploy/docker-compose.yml stop redis      # degraded mode, still no oversell
#   docker compose -f deploy/docker-compose.yml stop kafka      # outbox buffers, bookings continue
#   docker compose -f deploy/docker-compose.yml kill booking-worker  # leader fails over

x-booking-env: &booking-env
  DATABASE_URL: postgres://booking:booking@pgbouncer:5432/booking?sslmode=disable
  REDIS_ADDRS: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: booking.events
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
  ADMIN_KEY: ${ADMIN_KEY:-dev-admin-key}
  HTTP_ADDR: ":8081"
  DB_MAX_CONNS: "30"
  HOLD_TTL: 10m
  MOCK_PAYMENT_FAILURE_RATE: ${MOCK_PAYMENT_FAILURE_RATE:-0.02}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    command: >
      postgres -c max_connections=300 -c shared_buffers=512MB
               -c synchronous_commit=on -c wal_level=replica
               -c log_lock_waits=on -c deadlock_timeout=200ms
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 3s
      retries: 20

  # Transaction pooling: thousands of app connections -> a few dozen server connections.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "5000"
      DEFAULT_POOL_SIZE: "60"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7.2-alpine
    # noeviction: stock counters and queue state must never be silently evicted.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  booking-migrate:
    build: ../services/booking-service
    command: ["migrate"]
    environment:
      <<: *booking-env
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking?sslmode=disable  # session lock needs a direct conn
    depends_on:
      postgres: { condition: service_healthy }

  booking-api:
    build: ../services/booking-service
    command: ["api"]
    environment: *booking-env
    deploy: { replicas: 2 }
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_started }

  booking-worker:
    build: ../services/booking-service
    command: ["worker"]
    environment:
      <<: *booking-env
      # Advisory-lock leader election needs session semantics: bypass PgBouncer.
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking?sslmode=disable
    deploy: { replicas: 2 }
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      kafka: { condition: service_started }

  gateway:
    build: ../services/gateway
    environment:
      BOOKING_URL: http://booking-api:8081
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      QUEUE_SECRET: ${QUEUE_SECRET:-dev-queue-secret-change-me}
      DEV_AUTH: "true"
      ADMIT_RATE_PER_SEC: "200"
    deploy: { replicas: 2 }
    depends_on:
      booking-api: { condition: service_started }
      redis: { condition: service_healthy }

  lb:
    image: nginx:1.27-alpine
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["8080:80"]
    depends_on: [gateway]

  notification-worker:
    build: ../services/notification-worker
    environment:
      DATABASE_URL: postgres://booking:booking@pgbouncer:5432/booking
      KAFKA_BROKERS: kafka:9092
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      kafka: { condition: service_started }

  # One-shot helpers
  seed:
    profiles: [tools]
    build: ../services/booking-service
    command: ["seed"]
    environment: *booking-env
    depends_on:
      booking-migrate: { condition: service_completed_successfully }

  stampede:
    profiles: [tools]
    build: ../services/booking-service
    entrypoint: ["/stampede", "-gateway", "http://lb"]
    depends_on: [lb]

volumes:
  pg_data:
