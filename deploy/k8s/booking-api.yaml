apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: booking
spec:
  replicas: 6
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 25% }
  selector: { matchLabels: { app: booking-api } }
  template:
    metadata:
      labels: { app: booking-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8081" }
    spec:
      terminationGracePeriodSeconds: 40
      # Spread across zones and nodes: losing one AZ loses at most 1/3 of capacity.
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: booking-api } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: booking-api } } }
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/example/booking-service:latest
          args: ["api"]
          ports: [{ containerPort: 8081, name: http }]
          envFrom:
            - configMapRef: { name: booking-config }
            - secretRef: { name: booking-secrets }
          env:
            - { name: GOMAXPROCS, valueFrom: { resourceFieldRef: { resource: limits.cpu } } }
            - { name: DRAIN_DELAY, value: 5s }
          resources:
            requests: { cpu: "1", memory: 256Mi }
            limits: { cpu: "2", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: booking-api, namespace: booking }
spec:
  selector: { app: booking-api }
  ports: [{ port: 8081, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: booking-api, namespace: booking }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: booking-api }
  minReplicas: 6
  maxReplicas: 60   # bounded by PgBouncer/DB capacity, not by CPU: see docs/01
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 15 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 10, periodSeconds: 60 }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: booking-api, namespace: booking }
spec:
  minAvailable: 80%
  selector: { matchLabels: { app: booking-api } }
---
# Only the gateway may call the booking API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: booking-api-ingress, namespace: booking }
spec:
  podSelector: { matchLabels: { app: booking-api } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports: [{ port: 8081 }]
